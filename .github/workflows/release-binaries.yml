name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the release without publishing (no tag, no commit, no GitHub Release, no image)."
        type: boolean
        default: true

jobs:
  release-binaries:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: amine2233/ci-shared/.github/workflows/release-binaries.yml@1.1
    with:
      binary-name: assay
      release-args: ${{ inputs.dry_run && '--dry-run --write-change-log' || '--write-change-log' }}
      targets: '[{"runner":"macos-26","target":"darwin-amd64","args":"--arch x86_64"},{"runner":"macos-26","target":"darwin-arm64"},{"runner":"ubuntu-latest","target":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"}]'
    secrets: inherit

  # Native runner per architecture: the Swift build is far too slow under QEMU.
  image:
    name: Build image (${{ matrix.arch }})
    needs: release-binaries
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "tag=$(gh release view --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  image-manifest:
    name: Publish multi-arch image
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          TAGS=(-t "$IMAGE:$TAG")
          # Floating tags (1.2, 1, latest) only for stable releases, never for 1.2.6-beta.1.
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            TAGS+=(-t "$IMAGE:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" -t "$IMAGE:${BASH_REMATCH[1]}" -t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
